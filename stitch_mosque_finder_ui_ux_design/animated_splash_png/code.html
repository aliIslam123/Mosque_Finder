ntainer":"#97f7b9","outline-variant":"#bec9bf","surface-bright":"#f0fdf2","on-surface-variant":"#3f4941","on-secondary-fixed":"#00210f","secondary-fixed":"#97f7b9","surface-container-high":"#deebe1","surface-container-low":"#eaf7ed","surface-container-lowest":"#ffffff","on-tertiary-fixed-variant":"#604100","primary-container":"#167447","surface-container":"#e4f1e7","secondary-fixed-dim":"#7bda9f","surface":"#f0fdf2","inverse-on-surface":"#e7f4ea","on-primary":"#ffffff","background":"#f0fdf2","error":"#ba1a1a"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"space-sm":"0.5rem","space-lg":"1.5rem","margin":"1rem","gutter":"1rem","space-xs":"0.25rem","space-xl":"2rem","space-md":"1rem"},"fontFamily":{"body-lg":["IBM Plex Sans Arabic","IBM Plex Sans"],"body-md":["IBM Plex Sans Arabic","IBM Plex Sans"],"headline-sm":["IBM Plex Sans Arabic","IBM Plex Sans"],"label-md":["IBM Plex Sans Arabic","IBM Plex Sans"],"label-sm":["IBM Plex Sans Arabic","IBM Plex Sans"],"label-lg":["IBM Plex Sans Arabic","IBM Plex Sans"],"body-sm":["IBM Plex Sans Arabic","IBM Plex Sans"],"headline-lg":["IBM Plex Sans Arabic","IBM Plex Sans"],"display-lg":["IBM Plex Sans Arabic","IBM Plex Sans"],"headline-md":["IBM Plex Sans Arabic","IBM Plex Sans"]},"fontSize":{"body-lg":["16px",{"lineHeight":"26px","fontWeight":"400"}],"body-md":["14px",{"lineHeight":"22px","fontWeight":"400"}],"headline-sm":["18px",{"lineHeight":"26px","fontWeight":"600"}],"label-md":["12px",{"lineHeight":"16px","fontWeight":"600"}],"label-sm":["10px",{"lineHeight":"14px","fontWeight":"500"}],"label-lg":["14px",{"lineHeight":"20px","fontWeight":"600"}],"body-sm":["12px",{"lineHeight":"18px","fontWeight":"400"}],"headline-lg":["24px",{"lineHeight":"34px","fontWeight":"600"}],"display-lg":["32px",{"lineHeight":"44px","fontWeight":"700"}],"headline-md":["20px",{"lineHeight":"30px","fontWeight":"600"}]}}}};</script></head><body class="bg-gradient-to-b from-background via-surface-container-low to-surface-container-lowest text-on-surface flex flex-col items-center justify-center min-h-screen select-none relative overflow-x-hidden" id="screen-root"><main class="flex flex-col justify-between px-6 py-8 relative z-10 max-w-[390px] w-full h-full max-h-[844px] min-h-screen mx-auto overflow-hidden">
<!-- Subtle decorative ambient orbs -->
<div class="absolute top-12 left-1/2 -translate-x-1/2 w-72 h-72 rounded-full bg-primary-fixed/30 filter blur-3xl pointer-events-none -z-10 animate-ambient-top"></div>
<div class="absolute bottom-20 left-1/2 -translate-x-1/2 w-80 h-44 rounded-full bg-secondary-container/20 filter blur-2xl pointer-events-none -z-10 animate-ambient-bottom"></div>
<!-- Top bar / Indicator & PNG Export Button -->
<div class="w-full flex items-center justify-between pt-2 relative">
<div class="w-8"></div>
<div class="w-10 h-1 bg-outline-variant/50 rounded-full"></div>
<button class="w-9 h-9 rounded-full bg-surface-container/70 border border-surface-container hover:bg-white active:scale-95 text-secondary flex items-center justify-center transition-all duration-200 shadow-sm hover:shadow-md cursor-pointer" id="download-btn" onclick="captureAndDownload()" title="تحميل كصورة PNG">
<span class="material-symbols-outlined text-lg leading-none">download</span>
</button>
</div>
<!-- Center Identity Unit -->
<div class="flex flex-col items-center text-center my-auto px-2">
<!-- Mosque Emblem Container -->
<div class="relative flex items-center justify-center mb-7 group animate-float-badge transition-transform duration-300 hover:scale-105"><div class="absolute -inset-4 rounded-full bg-primary-fixed/30 animate-ripple pointer-events-none"></div><div class="absolute -inset-3 rounded-3xl bg-primary-fixed/40 blur-xl animate-halo pointer-events-none"></div><div class="relative w-28 h-28 rounded-3xl bg-white shadow-xl shadow-primary/10 border border-surface-container flex items-center justify-center p-4 transition-all duration-300 group-hover:shadow-2xl group-hover:shadow-primary/20"><svg class="w-16 h-16 text-[#167447] transition-transform duration-300 group-hover:scale-105" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 64 64"><path d="M32 10v4" stroke-width="2"></path><path d="M33.8 8.5a3 3 0 1 1-3.2 0 3 3 0 0 0 3.2 0z" fill="currentColor"></path><path d="M32 14c-8 0-14 6.5-14 14.5 0 2 0.3 3.5 0.5 4.5h27c0.2-1 0.5-2.5 0.5-4.5C46 20.5 40 14 32 14z" fill="#9ef5bd" fill-opacity="0.3"></path><path d="M27 49v-9a5 5 0 0 1 10 0v9" fill="currentColor" fill-opacity="0.15"></path><path d="M12 25h4l1 6v18h-6V31l1-6z"></path><path d="M11.5 25c0-2 2.5-5 2.5-5s2.5 3 2.5 5h-5z" fill="currentColor"></path><path d="M48 25h4l1 6v18h-6V31l1-6z"></path><path d="M47.5 25c0-2 2.5-5 2.5-5s2.5 3 2.5 5h-5z" fill="currentColor"></path><path d="M8 49h48" stroke-width="2.2"></path><path d="M14 54h36" stroke-width="1.8"></path><circle class="animate-pin" cx="32" cy="27" fill="currentColor" r="2.5"></circle></svg></div></div>
<!-- App Title -->
<h1 class="text-3xl font-bold tracking-tight text-on-surface mb-2 font-display-lg" dir="ltr" style="animation: fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.2s both;">
      Mosque Finder
    </h1>
<!-- Arabic Tagline -->
<p class="text-base text-on-surface-variant font-medium leading-relaxed max-w-[280px]" style="animation: fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.35s both;">
      دليلك لمساجد ومصليات الحي
    </p>
<!-- Subtle Feature Pills -->
<div class="flex items-center justify-center gap-2 mt-5" style="animation: fadeInUp 0.8s cubic-bezier(0.16,1,0.3,1) 0.5s both;"><span class="tag-pill cursor-pointer select-none inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-xs font-medium text-secondary active:scale-95"><span class="material-symbols-outlined text-sm">explore</span><span>أقرب مسجد</span></span><span class="tag-pill cursor-pointer select-none inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-xs font-medium text-secondary active:scale-95"><span class="material-symbols-outlined text-sm">schedule</span><span>أوقات الإقامة</span></span></div>
</div>
<!-- Bottom CTA & Metadata -->
<div class="w-full flex flex-col items-center gap-4 mt-auto pt-6">
<!-- Call to action button -->
<a class="btn-cta w-full max-w-sm py-4 px-6 rounded-2xl bg-[#167447] text-white font-semibold text-lg flex items-center justify-center gap-3 shadow-lg shadow-[#167447]/25 hover:bg-[#005a34] hover:shadow-xl hover:shadow-[#167447]/40 active:scale-[0.97] transition-all duration-300 relative overflow-hidden group" href="#home-map" style="animation: fadeInUp 0.85s cubic-bezier(0.16,1,0.3,1) 0.65s both;"><span class="relative z-10 font-semibold tracking-wide">Find Now</span><span class="material-symbols-outlined btn-icon text-xl rotate-180 relative z-10 transition-transform duration-300 group-hover:-translate-x-1" dir="ltr">arrow_forward</span><div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"></div></a>
<!-- Footer Note -->
<p class="text-xs text-outline font-medium tracking-wide" style="animation: fadeInUp 0.85s cubic-bezier(0.16,1,0.3,1) 0.8s both;">
      v1.0 • خدمة مجتمعية
    </p>
</div>
</main>
<!-- Status Toast Notification -->
<div class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2 flex items-center gap-2 px-4 py-2.5 rounded-full bg-on-surface text-surface text-xs font-medium shadow-lg" id="export-toast">
<span class="material-symbols-outlined text-sm text-secondary-fixed" id="toast-icon">downloading</span>
<span id="toast-message">جاري تجهيز الصورة...</span>
</div>
<script>
function showToast(message, icon, duration = 2500) {
  const toast = document.getElementById('export-toast');
  const msgEl = document.getElementById('toast-message');
  const iconEl = document.getElementById('toast-icon');
  if (!toast || !msgEl || !iconEl) return;
  msgEl.textContent = message;
  iconEl.textContent = icon;
  toast.classList.remove('opacity-0', '-translate-y-2');
  toast.classList.add('opacity-100', 'translate-y-0');
  setTimeout(() => {
    toast.classList.remove('opacity-100', 'translate-y-0');
    toast.classList.add('opacity-0', '-translate-y-2');
  }, duration);
}

function captureAndDownload() {
  const btn = document.getElementById('download-btn');
  const target = document.body;
  if (!target) return;

  if (btn) btn.style.visibility = 'hidden';
  showToast('جاري إنشاء صورة الشاشة...', 'hourglass_top', 1500);

  setTimeout(() => {
    html2canvas(target, {
      scale: 3,
      useCORS: true,
      backgroundColor: '#f0fdf2',
      logging: false,
      ignoreElements: (element) => element.id === 'download-btn' || element.id === 'export-toast'
    }).then(canvas => {
      if (btn) btn.style.visibility = 'visible';
      const link = document.createElement('a');
      link.download = 'mosque-finder-splash.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast('تم تحميل الصورة بنجاح!', 'check_circle', 2200);
    }).catch(err => {
      console.error('Capture failed:', err);
      if (btn) btn.style.visibility = 'visible';
      showToast('تعذر حفظ الصورة، يرجى المحاولة ثانية', 'error', 2500);
    });
  }, 100);
}
</script>
</body></html>
