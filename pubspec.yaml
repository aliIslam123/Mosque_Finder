name: mosque_finder
description: "Mosque Finder - مستكشف المساجد - Find nearby mosques, prayer times, Qibla direction"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local persistence
  shared_preferences: ^2.3.4

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2

  # Localization
  intl: ^0.20.2

  # Sensors (compass/gyroscope) - abstracted for Phase 2
  sensors_plus: ^6.1.0

  # Location services - abstracted
  geolocator: ^13.0.2
  permission_handler: ^11.4.0

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.1.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/


